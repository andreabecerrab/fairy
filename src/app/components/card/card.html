
<div
  class="experience"
  [class]="title ? size : 'img_experience'"
  [style.background-image]="src && !isVideo ? 'url(' + src + ')' : null">
 @if (isVideo) {
  <video class="experience__video" [src]="src" autoplay muted loop playsinline aria-hidden="true"></video>
 }
 @if (title) {
  <p class="experience__title">{{ title }}</p>
 }
  <ng-content></ng-content>
</div>
